<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self'; media-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'">
<title>Meet your copilot</title><style>
*{box-sizing:border-box}body{margin:0;background:#0b090c;color:#f7f0df;font:16px/1.45 system-ui,sans-serif}main{max-width:640px;margin:auto}video{display:block;width:100%;aspect-ratio:16/21;max-height:56vh;object-fit:contain;background:#0b090c}button{font:700 16px system-ui;min-height:48px;padding:10px 14px;border:1px solid #f1c550;border-radius:10px;background:#f1c550;color:#0b090c}button:focus-visible{outline:3px solid #fff;outline-offset:3px}.controls{display:flex;gap:8px;flex-wrap:wrap;padding:10px 14px}.controls button:first-child{flex:1}h1{font-size:16px;color:#f1c550;margin:12px 14px}p{margin:8px 14px}summary{min-height:44px;padding:10px 14px;cursor:pointer}details p{font-size:14px}small{color:#b9afb1}button:disabled{opacity:.6}</style>
<script defer src="/showcase.js"></script></head><body>
<main data-showcase="app"><video playsinline webkit-playsinline controls muted preload="metadata" poster="/media/showcases/codependent-v1.jpg" aria-label="Three-character introduction"></video>
<p data-showcase-current aria-live="polite"></p>
<div class="controls"><button type="button" data-showcase-sound disabled>▶ Watch &amp; hear the characters</button><button type="button" data-showcase-replay disabled>Replay</button></div>
<p data-showcase-status role="status">Loading the character preview. You can skip at any time.</p><h1 data-showcase-title>Meet your copilots</h1>
<details><summary>Read the dialogue</summary><div data-showcase-transcript></div></details>
<p><small>AI characters and voices. Adult preview language is bleeped.</small></p></main></body></html>
