<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self'; media-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'"><title>Meet your copilots</title><style>*{box-sizing:border-box}body{margin:0;background:#0b090c;color:#f7f0df;font:16px/1.4 system-ui}main{max-width:640px;margin:auto;padding:10px}button{cursor:pointer}
.character-picker{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;align-items:stretch;margin:16px auto;max-width:760px}
.picker-card{font:inherit;display:flex;flex-direction:column;align-items:center;gap:10px;padding:12px;background:#151116;border:1px solid #665437;border-radius:14px;color:#f7f0df;cursor:pointer;min-width:0}
.picker-card[hidden]{display:none}.picker-card[aria-pressed="true"]{border-color:#f1c550;background:#541326}.picker-card img{width:100%;height:200px;object-fit:cover;object-position:top;border-radius:8px}.picker-card strong{color:#f1c550;font-size:19px;line-height:1.2;min-height:46px}.picker-card q{font-size:16px;line-height:1.4;min-height:90px}.picker-card span{color:#f1c550;font-size:13px;font-weight:800;margin-top:auto}.picker-card:focus-visible{outline:3px solid #f1c550;outline-offset:3px}
.preview-caption{height:88px;overflow:auto;font-size:16px;line-height:22px}.preview-controls{display:flex;gap:8px;justify-content:center}.preview-controls button{font:700 15px system-ui;min-height:46px;padding:8px 16px;border-radius:9px;border:1px solid #f1c550;background:#f1c550;color:#0b090c}.preview-dialog{width:min(480px,calc(100% - 24px));max-height:94vh;padding:16px;border:1px solid #f1c550;border-radius:16px;background:#0b090c;color:#f7f0df}.preview-dialog::backdrop{background:#000b}.preview-dialog video{display:block;width:100%;height:43vh;object-fit:contain;background:#0b090c}.preview-dialog h3{margin:8px 0;color:#f1c550}.preview-close{display:block;margin-left:auto;min-height:44px;padding:8px 12px;font:700 16px system-ui;background:#151116;border:1px solid #f1c550;border-radius:8px;color:#f1c550}
@media(max-width:700px){.character-picker{gap:6px;margin:12px 0}.picker-card{padding:7px;gap:7px}.picker-card img{height:125px}.picker-card strong{font-size:14px;min-height:34px}.picker-card q{font-size:12px;line-height:17px;min-height:85px}.picker-card span{font-size:11px}.welcome-picker h2{font-size:1.7rem;margin:8px 0}.welcome-picker .showcase-modes{max-width:100%;margin:12px 0}.welcome-picker{padding:18px 0}.welcome-picker .actions{margin-top:12px}.welcome-picker .eyebrow{font-size:.7rem}.welcome-picker p{font-size:14px;margin:8px 0}}
@media(max-width:700px) and (max-height:700px){.picker-card img{height:80px}.welcome-picker h2{font-size:1.45rem}.character-picker{margin:8px 0}}
[data-single="true"]>.preview-dialog{display:block;position:static;width:100%;max-height:none;border:0;padding:0;margin:0}[data-single="true"]>.preview-dialog .preview-close{display:none}[data-single="true"]>p{display:none}main>.character-picker{gap:6px}main>.character-picker .picker-card{padding:7px;gap:7px}main>.character-picker img{height:116px}main>.character-picker strong{font-size:14px;min-height:34px}main>.character-picker q{font-size:12px;line-height:17px;min-height:85px}.preview-dialog video{height:43vh}.preview-caption{margin:8px 0}body .preview-dialog:not([open]){display:none}body [data-single="true"]>.preview-dialog{display:block}</style><script defer src="/showcase.js"></script></head><body><main data-showcase="app"><div class="character-picker" data-character-picker aria-label="Three character pictures and quotes"><button type="button" class="picker-card" data-showcase-character="brenda" data-showcase-group="codependent" aria-label="Watch and hear Brenda Borderline" aria-pressed="false"><img src="/media/characters/brenda.jpg" width="180" height="240" alt="" loading="eager"><strong>Brenda Borderline</strong><q>I packed reassurance for both of us.</q><span>▶ Hear me</span></button>
<button type="button" class="picker-card" data-showcase-character="marty" data-showcase-group="codependent" aria-label="Watch and hear Marty Martyr" aria-pressed="false"><img src="/media/characters/marty.jpg" width="180" height="240" alt="" loading="eager"><strong>Marty Martyr</strong><q>I did all this planning. No need to thank me.</q><span>▶ Hear me</span></button>
<button type="button" class="picker-card" data-showcase-character="hal" data-showcase-group="codependent" aria-label="Watch and hear HAL" aria-pressed="false"><img src="/media/characters/hal.jpg" width="180" height="240" alt="" loading="eager"><strong>HAL</strong><q>Your continued cooperation is comforting.</q><span>▶ Hear me</span></button>
<button type="button" class="picker-card" data-showcase-character="graham" data-showcase-group="sarcastic" aria-label="Watch and hear Graham Grudge" aria-pressed="false" hidden><img src="/media/characters/graham.jpg" width="180" height="240" alt="" loading="lazy"><strong>Graham Grudge</strong><q>I have lowered my expectations accordingly.</q><span>▶ Hear me</span></button>
<button type="button" class="picker-card" data-showcase-character="roxie" data-showcase-group="sarcastic" aria-label="Watch and hear Roxie Razor" aria-pressed="false" hidden><img src="/media/characters/roxie-approved.jpg" width="180" height="240" alt="" loading="lazy"><strong>Roxie Razor</strong><q>Make it look intentional.</q><span>▶ Hear me</span></button>
<button type="button" class="picker-card" data-showcase-character="raven" data-showcase-group="sarcastic" aria-label="Watch and hear Raven Morrow" aria-pressed="false" hidden><img src="/media/characters/raven.jpg" width="180" height="240" alt="" loading="lazy"><strong>Raven Morrow</strong><q>Another small victory against chaos.</q><span>▶ Hear me</span></button>
<button type="button" class="picker-card" data-showcase-character="frankie" data-showcase-group="adult" aria-label="Watch and hear Frankie Fastlane" aria-pressed="false" hidden><img src="/media/characters/frankie.jpg" width="180" height="240" alt="" loading="lazy"><strong>Frankie Fastlane</strong><q>Keep the wheels steady and the [bleep] optional.</q><span>▶ Hear me</span></button>
<button type="button" class="picker-card" data-showcase-character="rita" data-showcase-group="adult" aria-label="Watch and hear Rita Redline" aria-pressed="false" hidden><img src="/media/characters/rita.jpg" width="180" height="240" alt="" loading="lazy"><strong>Rita Redline</strong><q>Eyes up. We can discuss your [bleep] decisions later.</q><span>▶ Hear me</span></button>
<button type="button" class="picker-card" data-showcase-character="vivienne" data-showcase-group="adult" aria-label="Watch and hear Vivienne Vex" aria-pressed="false" hidden><img src="/media/characters/vivienne.jpg" width="180" height="240" alt="" loading="lazy"><strong>Vivienne Vex</strong><q>A little composure. This is not a [bleep] audition.</q><span>▶ Hear me</span></button></div><p data-showcase-status role="status">Tap a face to watch and hear that character.</p><dialog class="preview-dialog" data-preview-dialog><button type="button" class="preview-close" data-preview-close>Close preview</button><h3 data-showcase-title>Character preview</h3><video playsinline webkit-playsinline preload="none" aria-label="Character speaking preview"></video><p class="preview-caption" data-showcase-current aria-live="polite"></p><div class="preview-controls"><button type="button" data-showcase-pause>Play</button><button type="button" data-showcase-sound>Mute</button><button type="button" data-showcase-replay>Replay</button></div></dialog></main></body></html>
